<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoTranscript Student Wallet</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f8f9fa; }
    h1 { color: #0d6efd; }
    .credential { 
      background: white; 
      border: 1px solid #ddd; 
      padding: 20px; 
      margin: 20px 0; 
      border-radius: 12px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    button { 
      padding: 14px 24px; 
      font-size: 16px; 
      margin: 8px 4px; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
    }
    .share { background: #198754; color: white; }
    .copy { background: #6c757d; color: white; }
  </style>
</head>
<body>
  <h1>🪪 My NeoTranscript Wallet</h1>
  <p>Your transcripts. Your control.</p>

  <div class="credential">
    <h3>📜 Bachelor of Science in Computer Science</h3>
    <p><strong>Student:</strong> Alex Rivera</p>
    <p><strong>University:</strong> Example University</p>
    <p><strong>GPA:</strong> 3.87 • Graduated: May 15, 2025</p>
    <p><strong>Honors:</strong> Dean's List</p>
    
    <button class="share" onclick="shareCredential()">Share Credential</button>
    <button class="copy" onclick="copyCredential()">Copy JSON for Verifier</button>
  </div>

  <script>
    const credential = {
      "@context": ["https://www.w3.org/ns/credentials/v2"],
      "type": ["VerifiableCredential", "TranscriptCredential"],
      "issuer": "https://example-university.edu",
      "issuanceDate": "2025-05-20T00:00:00Z",
      "credentialSubject": {
        "legalName": "Alexander James Rivera",
        "preferredName": "Alex Rivera",
        "degree": "Bachelor of Science in Computer Science",
        "major": "Computer Science",
        "gpa": 3.87,
        "graduationDate": "2025-05-15",
        "academicHonors": ["Dean's List"]
      }
    };

    function shareCredential() {
      alert("In a real wallet this would generate a secure public link or QR code.\n\nFor now, use the Copy JSON button and paste into Verifier.");
    }

    function copyCredential() {
      navigator.clipboard.writeText(JSON.stringify(credential, null, 2)).then(() => {
        alert("✅ JSON copied! Go to Verifier Demo and paste it.");
      });
    }
  </script>
</body>
</html>
