<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoTranscript Student Wallet</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; background: #f8f9fa; }
    h1 { color: #0d6efd; }
    .credential { 
      background: white; 
      border: 1px solid #ddd; 
      padding: 20px; 
      margin: 20px 0; 
      border-radius: 12px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    button { 
      padding: 14px 24px; 
      font-size: 16px; 
      margin: 8px 4px; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
    }
    .share { background: #198754; color: white; }
    .copy { background: #6c757d; color: white; }
    label { display: block; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>🪪 My NeoTranscript Wallet</h1>
  <p>Your transcripts and diplomas. Your control.</p>

  <div class="credential">
    <h3>📜 Bachelor of Science in Computer Science</h3>
    <p><strong>Student:</strong> Alex Rivera</p>
    <p><strong>Institution:</strong> Example University</p>
    <p><strong>GPA:</strong> 3.87 • Graduated: May 15, 2025</p>

    <h4>Selective Disclosure</h4>
    <label><input type="checkbox" id="shareFull" checked> Share full transcript (including all courses & grades)</label>
    <label><input type="checkbox" id="shareGPA" checked> Share GPA</label>
    <label><input type="checkbox" id="shareHonors" checked> Share honors</label>

    <button class="share" onclick="shareCredential()">Share Selected Version</button>
    <button class="copy" onclick="copyFullCredential()">Copy Full JSON</button>
  </div>

  <script>
    const fullCredential = {
      "@context": ["https://www.w3.org/ns/credentials/v2"],
      "type": ["VerifiableCredential", "TranscriptCredential"],
      "issuer": "https://example-university.edu",
      "issuanceDate": "2025-05-20T00:00:00Z",
      "credentialSubject": {
        "legalName": "Alexander James Rivera",
        "preferredName": "Alex Rivera",
        "degree": "Bachelor of Science in Computer Science",
        "major": "Computer Science",
        "gpa": 3.87,
        "graduationDate": "2025-05-15",
        "academicHonors": ["Dean's List", "Summa Cum Laude"],
        "courseRecord": [
          { "term": "Fall 2024", "courseCode": "CS 301", "courseTitle": "Data Structures", "credits": 4, "grade": "A" },
          { "term": "Spring 2025", "courseCode": "CS 450", "courseTitle": "Software Engineering", "credits": 3, "grade": "A-" }
        ]
      }
    };

    function shareCredential() {
      const shareFull = document.getElementById('shareFull').checked;
      const shareGPA = document.getElementById('shareGPA').checked;
      const shareHonors = document.getElementById('shareHonors').checked;

      let shared = JSON.parse(JSON.stringify(fullCredential));

      if (!shareFull) {
        delete shared.credentialSubject.courseRecord;
      }
      if (!shareGPA) {
        delete shared.credentialSubject.gpa;
      }
      if (!shareHonors) {
        delete shared.credentialSubject.academicHonors;
      }

      const json = JSON.stringify(shared, null, 2);
      navigator.clipboard.writeText(json).then(() => {
        alert("✅ Shared version copied to clipboard!\nPaste it into the Verifier Demo.");
      });
    }

    function copyFullCredential() {
      const json = JSON.stringify(fullCredential, null, 2);
      navigator.clipboard.writeText(json).then(() => {
        alert("✅ Full credential JSON copied to clipboard!");
      });
    }
  </script>
</body>
</html>
