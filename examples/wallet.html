<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoTranscript Wallet</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; line-height: 1.6; }
    button { padding: 12px 20px; margin: 8px 4px; font-size: 16px; }
    .card { border: 2px solid #4CAF50; padding: 20px; border-radius: 8px; margin: 15px 0; background: #f9fff9; }
    table { width: 100%; border-collapse: collapse; margin: 15px 0; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #f0f0f0; }
    .scrollable { max-height: 400px; overflow-y: auto; border: 1px solid #eee; border-radius: 6px; }
    .success { color: green; font-weight: bold; }
  </style>
</head>
<body>
  <h1>NeoTranscript Student Wallet</h1>
  <p>You own your credentials. No company or school controls them.</p>

  <button onclick="loadLastCredential()">Load Latest Issued Credential</button>
  <button onclick="clearWallet()">Clear Wallet</button>

  <div id="wallet"></div>

  <h3>Raw Credential JSON</h3>
  <pre id="raw"></pre>

  <hr>
  <p><a href="index.html">← Demo Hub</a> | 
     <a href="issuer.html">← Issuer</a> | 
     <a href="verifier.html">Go to Verifier →</a></p>

  <script>
    let currentCredential = null;

    function displayCredential(cred) {
      currentCredential = cred;
      const walletEl = document.getElementById('wallet');
      const rawEl = document.getElementById('raw');
      const subject = cred.credentialSubject || cred;

      const courses = subject.courses || [];
      let courseHTML = '';
      
      if (courses.length > 0) {
        courseHTML = `
          <h3>Courses (${courses.length})</h3>
          <div class="scrollable">
            <table>
              <thead>
                <tr>
                  <th>Code</th>
                  <th>Course Name</th>
                  <th>Grade</th>
                  <th>Credits</th>
                </tr>
              </thead>
              <tbody>
                ${courses.map(c => `
                  <tr>
                    <td><strong>${c.courseCode}</strong></td>
                    <td>${c.name}</td>
                    <td>${c.grade}</td>
                    <td>${c.credits}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>`;
      }

      const html = `
        <div class="card">
          <h2>${subject.name || 'Student'}</h2>
          <p><strong>Institution:</strong> ${subject.institution || 'Fargo University (Demo)'}</p>
          <p><strong>${cred.type?.includes('HighSchoolDiplomaCredential') ? 'High School Diploma' : 'Degree'}:</strong> ${subject.degree || 'N/A'}</p>
          <p><strong>GPA:</strong> ${subject.gpa || 'N/A'}</p>
          <p><strong>Graduation Date:</strong> ${subject.graduationDate || 'N/A'}</p>
          <p><strong>Issued:</strong> ${new Date(cred.issuanceDate).toLocaleDateString()}</p>
          
          ${courseHTML}
        </div>
      `;

      walletEl.innerHTML = html;
      rawEl.textContent = JSON.stringify(cred, null, 2);
    }

    async function loadLastCredential() {
      const saved = localStorage.getItem('lastIssuedCredential');
      if (!saved) {
        alert("No credential found. Go to issuer.html first and issue one.");
        return;
      }
      try {
        const cred = JSON.parse(saved);
        displayCredential(cred);
      } catch (e) {
        alert("Error loading credential: " + e.message);
      }
    }

    function clearWallet() {
      if (confirm("Clear all credentials from this demo wallet?")) {
        localStorage.removeItem('lastIssuedCredential');
        document.getElementById('wallet').innerHTML = '<p style="color:#666;">Wallet cleared.</p>';
        document.getElementById('raw').textContent = '';
      }
    }

    window.onload = () => {
      const saved = localStorage.getItem('lastIssuedCredential');
      if (saved) displayCredential(JSON.parse(saved));
    };
  </script>
</body>
</html>
