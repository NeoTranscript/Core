<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoTranscript Wallet</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 40px auto; padding: 20px; line-height: 1.6; }
    button { padding: 12px 20px; margin: 8px 4px; font-size: 16px; }
    .card { border: 2px solid #4CAF50; padding: 25px; border-radius: 12px; margin: 20px 0; background: #f9fff9; }
    table { width: 100%; border-collapse: collapse; margin: 15px 0; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #f0f0f0; }
    .scrollable { max-height: 450px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; }
    .selective { background: #f0f8ff; padding: 20px; border-radius: 12px; margin: 20px 0; }
  </style>
</head>
<body>
  <h1>NeoTranscript Student Wallet</h1>
  <p>You own it. You control what you share.</p>

  <button onclick="loadLastCredential()">Load Latest Credential</button>
  <button onclick="clearWallet()">Clear Wallet</button>

  <div id="wallet"></div>

  <div id="selectiveControls" class="selective" style="display:none;">
    <h3>Selective Disclosure — Choose what to share</h3>
    <label><input type="checkbox" id="shareName" checked> Name</label><br>
    <label><input type="checkbox" id="shareMajor" checked> Major</label><br>
    <label><input type="checkbox" id="shareDegree" checked> Degree</label><br>
    <label><input type="checkbox" id="shareGPA" checked> GPA</label><br>
    <label><input type="checkbox" id="shareGradDate" checked> Graduation Date</label><br>
    <label><input type="checkbox" id="shareHonors" checked> Honors</label><br>
    
    <h4>Courses</h4>
    <div id="courseCheckboxes"></div>
    
    <button onclick="createSharedVersion()">Create Shared Version</button>
  </div>

  <div id="sharedResult" style="display:none;">
    <h3>Shared Credential JSON</h3>
    <pre id="sharedJSON"></pre>
    <button onclick="copyShared()">Copy JSON</button>
    <button onclick="downloadShared()">Download JSON</button>
  </div>

  <button onclick="exportToPDF()" style="background:#d97706; color:white; font-weight:bold;">📄 Export as Professional PDF Transcript</button>

  <hr>
  <p><a href="index.html">← Demo Hub</a> | 
     <a href="issuer.html">← Issuer</a> | 
     <a href="verifier.html">Go to Verifier →</a></p>

  <script>
    let currentCredential = null;

    function displayCredential(cred) {
      currentCredential = cred;
      const walletEl = document.getElementById('wallet');
      const subject = cred.credentialSubject || cred;
      const courses = subject.courses || [];

      let html = `
        <div class="card">
          <h2>${subject.name || 'Student'}</h2>
          <p><strong>Institution:</strong> ${subject.institution || 'Fargo University (Demo)'}</p>
          <p><strong>Major:</strong> ${subject.major || 'N/A'}</p>
          <p><strong>Degree:</strong> ${subject.degree || 'N/A'}</p>
          <p><strong>GPA:</strong> ${subject.gpa || 'N/A'}</p>
          <p><strong>Graduation:</strong> ${subject.graduationDate || 'N/A'}</p>
          ${subject.honors ? `<p><strong>Honors:</strong> ${subject.honors}</p>` : ''}
          
          <h3>Courses (${courses.length})</h3>
          <div class="scrollable">
            <table>
              <thead><tr><th>Code</th><th>Course Name</th><th>Grade</th><th>Credits</th></tr></thead>
              <tbody>${courses.map(c => `
                <tr><td><strong>${c.courseCode}</strong></td><td>${c.name}</td><td>${c.grade}</td><td>${c.credits}</td></tr>
              `).join('')}</tbody>
            </table>
          </div>
        </div>
      `;

      walletEl.innerHTML = html;
      document.getElementById('selectiveControls').style.display = 'block';
      renderCourseCheckboxes(courses);
    }

    function renderCourseCheckboxes(courses) {
      const container = document.getElementById('courseCheckboxes');
      container.innerHTML = courses.map((course, i) => `
        <label><input type="checkbox" class="courseChk" data-index="${i}" checked>
          ${course.courseCode} — ${course.name} (${course.grade})
        </label><br>
      `).join('');
    }

    // ... (selective disclosure functions remain the same as previous version)
    function createSharedVersion() { /* same as before */ 
      if (!currentCredential) return;
      const subject = {...currentCredential.credentialSubject};
      const courses = subject.courses || [];

      if (!document.getElementById('shareName').checked) subject.name = "[REDACTED]";
      if (!document.getElementById('shareMajor').checked) delete subject.major;
      if (!document.getElementById('shareDegree').checked) subject.degree = "[REDACTED]";
      if (!document.getElementById('shareGPA').checked) delete subject.gpa;
      if (!document.getElementById('shareGradDate').checked) delete subject.graduationDate;
      if (!document.getElementById('shareHonors').checked) delete subject.honors;

      const selectedIndices = Array.from(document.querySelectorAll('.courseChk:checked'))
                                  .map(chk => parseInt(chk.dataset.index));
      subject.courses = courses.filter((_, i) => selectedIndices.includes(i));

      const sharedVC = { ...currentCredential, credentialSubject: subject, disclosureMetadata: { sharedAt: new Date().toISOString() }};
      document.getElementById('sharedJSON').textContent = JSON.stringify(sharedVC, null, 2);
      document.getElementById('sharedResult').style.display = 'block';
    }

    function copyShared() {
      navigator.clipboard.writeText(document.getElementById('sharedJSON').textContent);
      alert("✅ Copied!");
    }

    function downloadShared() {
      const text = document.getElementById('sharedJSON').textContent;
      const blob = new Blob([text], {type: 'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'neo-transcript-shared.json';
      a.click();
    }

    // New: PDF Export
    async function exportToPDF() {
      if (!currentCredential) return alert("Load a credential first");
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const subject = currentCredential.credentialSubject || currentCredential;

      doc.setFontSize(20);
      doc.text("NeoTranscript", 105, 20, { align: "center" });
      doc.setFontSize(16);
      doc.text("Official Academic Transcript", 105, 30, { align: "center" });

      doc.setFontSize(12);
      doc.text(`Name: ${subject.name || "N/A"}`, 20, 50);
      doc.text(`Institution: ${subject.institution || "Fargo University (Demo)"}`, 20, 60);
      if (subject.major) doc.text(`Major: ${subject.major}`, 20, 70);
      doc.text(`Degree: ${subject.degree || "N/A"}`, 20, 80);
      if (subject.gpa) doc.text(`GPA: ${subject.gpa}`, 20, 90);
      if (subject.graduationDate) doc.text(`Graduation Date: ${subject.graduationDate}`, 20, 100);
      if (subject.honors) doc.text(`Honors: ${subject.honors}`, 20, 110);

      // Courses Table
      doc.text("Courses", 20, 130);
      const courses = subject.courses || [];
      let y = 140;
      doc.setFontSize(10);
      courses.forEach(c => {
        if (y > 270) { doc.addPage(); y = 20; }
        doc.text(`${c.courseCode} — ${c.name} (${c.grade})  [${c.credits} credits]`, 20, y);
        y += 10;
      });

      doc.setFontSize(10);
      doc.text("This is a cryptographically signed verifiable credential.", 20, 280);
      doc.text("Student-controlled via NeoTranscript", 20, 290);

      doc.save(`${subject.name || 'student'}_transcript.pdf`);
      alert("✅ PDF downloaded! (Looks professional when printed)");
    }

    async function loadLastCredential() {
      const saved = localStorage.getItem('lastIssuedCredential');
      if (!saved) return alert("No credential found. Go to Issuer first.");
      displayCredential(JSON.parse(saved));
    }

    function clearWallet() {
      if (confirm("Clear wallet?")) location.reload();
    }

    window.onload = () => {
      const saved = localStorage.getItem('lastIssuedCredential');
      if (saved) displayCredential(JSON.parse(saved));
    };
  </script>
</body>
</html>
