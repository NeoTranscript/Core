<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoTranscript Issuer Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; line-height: 1.6; }
    input, select, button { padding: 10px; margin: 5px; font-size: 16px; }
    button { cursor: pointer; }
    .course { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; background: #fafafa; }
    textarea { width: 100%; height: 400px; font-family: monospace; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>NeoTranscript Issuer Demo — Full Transcript Builder</h1>
  <p>Build rich college transcripts or high school diplomas with full course records.</p>

  <h2>Student Info</h2>
  <label>Name: <input type="text" id="name" value="Alex Rivera"></label><br>
  <label>Student ID: <input type="text" id="studentId" value="S12345"></label><br>
  <label>Degree / Diploma: <input type="text" id="degree" value="BS Computer Science"></label><br>
  <label>GPA: <input type="number" id="gpa" value="3.87" step="0.01"></label><br>
  <label>Graduation Date: <input type="date" id="gradDate" value="2025-05-15"></label><br><br>

  <h2>Courses (Add as many as needed)</h2>
  <div id="courses"></div>
  <button onclick="addCourse()">+ Add Course</button><br><br>

  <button onclick="issueCredential(false)">Issue College Transcript</button>
  <button onclick="issueCredential(true)">Issue High School Diploma</button>

  <h3>Generated Signed Credential</h3>
  <textarea id="output" readonly></textarea>

  <p><strong>Status:</strong> <span id="status"></span></p>

  <hr>
  <p><a href="index.html">← Demo Hub</a> | <a href="wallet.html">Go to Wallet →</a></p>

  <script>
    let courseCount = 0;

    function addCourse() {
      courseCount++;
      const div = document.createElement('div');
      div.className = 'course';
      div.id = `course-${courseCount}`;
      div.innerHTML = `
        <input type="text" placeholder="Course Code" value="CS${100 + courseCount}" style="width:120px">
        <input type="text" placeholder="Course Name" value="Course ${courseCount}" style="width:250px">
        <select>
          <option>A</option><option>A-</option><option>B+</option><option>B</option><option>B-</option><option>C</option>
        </select>
        <input type="number" placeholder="Credits" value="3" style="width:80px">
        <button onclick="this.parentElement.remove()">Remove</button>
      `;
      document.getElementById('courses').appendChild(div);
    }

    function getCourses() {
      const courses = [];
      document.querySelectorAll('.course').forEach(course => {
        const inputs = course.querySelectorAll('input, select');
        courses.push({
          courseCode: inputs[0].value,
          name: inputs[1].value,
          grade: inputs[2].value,
          credits: parseFloat(inputs[3].value)
        });
      });
      return courses;
    }

    async function issueCredential(isDiploma = false) {
      const statusEl = document.getElementById('status');
      const outputEl = document.getElementById('output');
      
      statusEl.textContent = 'Signing credential...';
      
      try {
        const courses = getCourses();
        if (courses.length === 0) addCourse(); // ensure at least one

        const credential = {
          "@context": [
            "https://www.w3.org/2018/credentials/v1",
            "https://neotranscript.org/contexts/transcript/v1"
          ],
          "id": `https://neotranscript.org/credentials/${Date.now()}`,
          "type": ["VerifiableCredential", isDiploma ? "HighSchoolDiplomaCredential" : "TranscriptCredential"],
          "issuer": "https://neotranscript.org/issuers/fargo-university",
          "issuanceDate": new Date().toISOString(),
          "credentialSubject": {
            "id": `did:key:z${Math.random().toString(36).substring(2)}`,
            "name": document.getElementById('name').value,
            "studentId": document.getElementById('studentId').value,
            "degree": document.getElementById('degree').value,
            "graduationDate": document.getElementById('gradDate').value,
            "gpa": parseFloat(document.getElementById('gpa').value),
            "institution": "Fargo University (Demo)",
            "courses": courses
          }
        };

        const proof = {
          "type": "Ed25519Signature2020",
          "created": new Date().toISOString(),
          "verificationMethod": "https://neotranscript.org/issuers/fargo-university#key-1",
          "proofPurpose": "assertionMethod"
        };

        const signedVC = { ...credential, proof };

        outputEl.value = JSON.stringify(signedVC, null, 2);
        statusEl.innerHTML = `<span class="success">✅ ${isDiploma ? 'Diploma' : 'Full Transcript'} issued successfully! (${courses.length} courses)</span>`;

        localStorage.setItem('lastIssuedCredential', JSON.stringify(signedVC));

      } catch (err) {
        statusEl.innerHTML = `<span class="error">Error: ${err.message}</span>`;
      }
    }

    // Add 3 sample courses on load
    window.onload = () => {
      for (let i = 0; i < 3; i++) addCourse();
      document.getElementById('status').textContent = 'Ready — add/edit courses then issue';
    };
  </script>
</body>
</html>
