<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoTranscript Issuer Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
    h1 { color: #0d6efd; }
    input, select { width: 100%; padding: 10px; margin: 8px 0; }
    button { padding: 14px 28px; background: #0d6efd; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
    #output { margin-top: 20px; background: #f8f9fa; padding: 20px; border-radius: 12px; white-space: pre-wrap; font-family: monospace; }
  </style>
</head>
<body>
  <h1>NeoTranscript Issuer Demo</h1>
  <p>Issue either a High School Diploma or College Transcript</p>

  <label>Credential Type</label>
  <select id="credentialType">
    <option value="transcript">College Transcript</option>
    <option value="diploma">High School Diploma</option>
  </select>

  <label>Student Legal Name</label>
  <input type="text" id="legalName" value="Alexander James Rivera">

  <label>Preferred Name</label>
  <input type="text" id="preferredName" value="Alex Rivera">

  <label id="institutionLabel">University / School Name</label>
  <input type="text" id="institution" value="Example University">

  <label id="degreeLabel">Degree / Diploma Type</label>
  <input type="text" id="degree" value="Bachelor of Science in Computer Science">

  <label>GPA</label>
  <input type="text" id="gpa" value="3.87">

  <label>Graduation Date</label>
  <input type="date" id="gradDate" value="2025-05-15">

  <button onclick="issueCredential()">Issue Credential</button>

  <div id="output"></div>

  <script>
    function issueCredential() {
      const type = document.getElementById('credentialType').value;
      const isTranscript = type === 'transcript';

      const credential = {
        "@context": ["https://www.w3.org/ns/credentials/v2"],
        "type": ["VerifiableCredential", isTranscript ? "TranscriptCredential" : "DiplomaCredential"],
        "issuer": `https://${document.getElementById('institution').value.toLowerCase().replace(/ /g, '-')}.edu`,
        "issuanceDate": new Date().toISOString(),
        "credentialSubject": {
          "legalName": document.getElementById('legalName').value,
          "preferredName": document.getElementById('preferredName').value,
          "gpa": parseFloat(document.getElementById('gpa').value),
          "graduationDate": document.getElementById('gradDate').value,
        }
      };

      if (isTranscript) {
        credential.credentialSubject.degree = document.getElementById('degree').value;
        credential.credentialSubject.major = "Computer Science";
      } else {
        credential.credentialSubject.diplomaType = document.getElementById('degree').value || "High School Diploma";
      }

      document.getElementById('output').innerHTML = `
        <strong>✅ ${isTranscript ? 'College Transcript' : 'High School Diploma'} Issued!</strong><br><br>
        Copy this JSON and test it in the Verifier:<br><br>
        <pre>${JSON.stringify(credential, null, 2)}</pre>
      `;
    }
  </script>
</body>
</html>
