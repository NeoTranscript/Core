<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoTranscript Issuer Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
    h1 { color: #0d6efd; }
    input, select { width: 100%; padding: 10px; margin: 8px 0; }
    button { padding: 12px 24px; background: #0d6efd; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
    button:hover { background: #0b5ed7; }
    #output { margin-top: 20px; background: #f8f9fa; padding: 15px; border-radius: 8px; white-space: pre-wrap; font-family: monospace; }
  </style>
</head>
<body>
  <h1>NeoTranscript Issuer Demo</h1>
  <p>Simulate a college registrar issuing a signed transcript.</p>

  <label>Student Name</label>
  <input type="text" id="name" value="Alex Rivera">

  <label>Degree</label>
  <input type="text" id="degree" value="Bachelor of Computer Science">

  <label>GPA</label>
  <input type="text" id="gpa" value="3.87">

  <label>Graduation Date</label>
  <input type="date" id="gradDate" value="2025-05-15">

  <label>University</label>
  <input type="text" id="university" value="Example University">

  <button onclick="issueCredential()">Issue Signed Credential</button>

  <div id="output"></div>

  <script>
    function issueCredential() {
      const name = document.getElementById('name').value;
      const degree = document.getElementById('degree').value;
      const gpa = document.getElementById('gpa').value;
      const gradDate = document.getElementById('gradDate').value;
      const university = document.getElementById('university').value;

      const credential = {
        "@context": ["https://www.w3.org/ns/credentials/v2"],
        "type": ["VerifiableCredential", "TranscriptCredential"],
        "issuer": `https://${university.toLowerCase().replace(/ /g, '-')}.edu`,
        "issuanceDate": new Date().toISOString(),
        "credentialSubject": {
          "name": name,
          "degree": degree,
          "gpa": gpa,
          "graduationDate": gradDate,
          "major": "Computer Science"
        }
      };

      const outputDiv = document.getElementById('output');
      outputDiv.innerHTML = `
        <strong>✅ Credential Issued Successfully!</strong><br><br>
        Copy the JSON below and paste it into the <a href="verifier.html">Verifier Demo</a>:
        <pre>${JSON.stringify(credential, null, 2)}</pre>
      `;
    }
  </script>
</body>
</html>
