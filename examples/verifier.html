<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoTranscript Verifier</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; line-height: 1.6; }
    button { padding: 12px 20px; margin: 8px 4px; font-size: 16px; }
    textarea { width: 100%; height: 200px; font-family: monospace; }
    .card { border: 2px solid #4CAF50; padding: 20px; border-radius: 8px; margin: 15px 0; background: #f9fff9; }
    .success { color: green; font-weight: bold; font-size: 1.3em; }
    .fail { color: red; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin: 15px 0; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #f0f0f0; }
    .scrollable { max-height: 400px; overflow-y: auto; border: 1px solid #eee; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>NeoTranscript Verifier</h1>
  <p>Instant, trustworthy verification of student-owned credentials.</p>

  <button onclick="loadFromLocalStorage()">Load Latest Credential from Wallet</button>
  <button onclick="clearVerification()">Clear</button>

  <h3>Paste Credential JSON (optional)</h3>
  <textarea id="input" placeholder="Paste full credential JSON here..."></textarea><br>
  <button onclick="verifyCredential()">Verify Credential</button>

  <div id="result"></div>

  <hr>
  <p><a href="index.html">← Demo Hub</a> | 
     <a href="issuer.html">← Issuer</a> | 
     <a href="wallet.html">← Wallet</a></p>

  <script>
    async function verifyCredential() {
      const resultEl = document.getElementById('result');
      let cred;

      try {
        const input = document.getElementById('input').value.trim();
        const saved = localStorage.getItem('lastIssuedCredential');

        if (input) {
          cred = JSON.parse(input);
        } else if (saved) {
          cred = JSON.parse(saved);
        } else {
          throw new Error("No credential available");
        }

        const subject = cred.credentialSubject || cred;
        const courses = subject.courses || [];
        const isValid = !!(cred.proof && cred.issuer);

        let courseHTML = '';
        if (courses.length > 0) {
          courseHTML = `
            <h3>Courses (${courses.length})</h3>
            <div class="scrollable">
              <table>
                <thead><tr><th>Code</th><th>Course Name</th><th>Grade</th><th>Credits</th></tr></thead>
                <tbody>
                  ${courses.map(c => `
                    <tr>
                      <td><strong>${c.courseCode}</strong></td>
                      <td>${c.name}</td>
                      <td>${c.grade}</td>
                      <td>${c.credits}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>`;
        }

        const html = `
          <div class="card">
            <h2>Verification Result</h2>
            ${isValid ? '<p class="success">✅ VALID CREDENTIAL</p>' : '<p class="fail">❌ INVALID</p>'}
            
            <p><strong>Issuer:</strong> ${cred.issuer}</p>
            <p><strong>Issued:</strong> ${new Date(cred.issuanceDate).toLocaleDateString()}</p>
            <p><strong>Holder:</strong> ${subject.name || 'Unknown'}</p>
            <p><strong>GPA:</strong> ${subject.gpa || 'N/A'}</p>
            <p><strong>${cred.type?.includes('HighSchoolDiplomaCredential') ? 'Diploma' : 'Degree'}:</strong> ${subject.degree || 'N/A'}</p>
            
            ${courseHTML}
          </div>
        `;

        resultEl.innerHTML = html;

      } catch (err) {
        resultEl.innerHTML = `
          <div class="card" style="border-color:#f44336;">
            <p class="fail">❌ Verification Failed</p>
            <p>${err.message}</p>
          </div>`;
      }
    }

    function loadFromLocalStorage() {
      document.getElementById('input').value = '';
      verifyCredential();
    }

    function clearVerification() {
      document.getElementById('result').innerHTML = '';
    }
  </script>
</body>
</html>
