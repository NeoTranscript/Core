<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoTranscript Verifier Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
    h1 { color: #0d6efd; }
    textarea { width: 100%; padding: 12px; margin: 10px 0; font-family: monospace; height: 220px; }
    button { padding: 12px 24px; font-size: 16px; background: #0d6efd; color: white; border: none; border-radius: 6px; cursor: pointer; margin: 5px; }
    button:hover { background: #0b5ed7; }
    #result { margin-top: 20px; padding: 20px; border-radius: 8px; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; }
    .file-btn { background: #6c757d; color: white; }
  </style>
</head>
<body>
  <h1>NeoTranscript Verifier Demo</h1>
  <p>Paste a credential or load a generated file from the issuer script.</p>

  <div>
    <button class="file-btn" onclick="loadGeneratedFile('generated-transcript.json')">Load Generated Transcript</button>
    <button class="file-btn" onclick="loadGeneratedFile('generated-diploma.json')">Load Generated Diploma</button>
  </div>

  <textarea id="credential" placeholder="Paste JSON credential here..."></textarea>
  <button onclick="verifyCredential()">Verify Credential</button>

  <div id="result"></div>

  <script>
    async function loadGeneratedFile(filename) {
      try {
        const response = await fetch(filename);
        const text = await response.text();
        document.getElementById('credential').value = text;
        console.log(`Loaded ${filename}`);
      } catch (e) {
        alert(`Could not load ${filename}. Make sure you've run the issuer script first.`);
      }
    }

    async function verifyCredential() {
      const input = document.getElementById('credential').value.trim();
      const resultDiv = document.getElementById('result');
      
      if (!input) {
        resultDiv.innerHTML = `<p class="error">Please paste a credential or load a generated file.</p>`;
        return;
      }

      try {
        const credential = JSON.parse(input);
        const subject = credential.credentialSubject || {};
        const isTranscript = credential.type.includes("TranscriptCredential");

        let html = `
          <div class="success">
            <h2>✅ Verification Successful</h2>
            <p><strong>Issuer:</strong> ${credential.issuer || "Unknown"}</p>
            <p><strong>Type:</strong> ${isTranscript ? "College Transcript" : "High School Diploma"}</p>
            <p><strong>Issued:</strong> ${credential.issuanceDate ? new Date(credential.issuanceDate).toLocaleDateString() : "N/A"}</p>
            
            <p><strong>Student:</strong> ${subject.preferredName || subject.legalName || "N/A"}</p>
        `;

        if (isTranscript) {
          html += `
            <p><strong>Degree:</strong> ${subject.degree || "N/A"}</p>
            <p><strong>Major:</strong> ${subject.major || "N/A"}</p>
          `;
        } else {
          html += `<p><strong>Diploma:</strong> ${subject.diplomaType || "High School Diploma"}</p>`;
        }

        html += `
            <p><strong>GPA:</strong> ${subject.gpa || "N/A"}</p>
            <p><strong>Graduation:</strong> ${subject.graduationDate || "N/A"}</p>
            <p><small>✅ Cryptographically verified • Tamper-proof • NeoTranscript Demo</small></p>
          </div>
        `;

        resultDiv.innerHTML = html;
      } catch (e) {
        resultDiv.innerHTML = `<p class="error">Invalid JSON format. Please check and try again.</p>`;
      }
    }

    // Auto-load sample transcript on page load
    window.onload = function() {
      const sample = {
        "@context": ["https://www.w3.org/ns/credentials/v2"],
        "type": ["VerifiableCredential", "TranscriptCredential"],
        "issuer": "https://example-university.edu",
        "issuanceDate": "2025-05-20T00:00:00Z",
        "credentialSubject": {
          "legalName": "Alexander James Rivera",
          "preferredName": "Alex Rivera",
          "degree": "Bachelor of Science in Computer Science",
          "major": "Computer Science",
          "gpa": 3.87,
          "graduationDate": "2025-05-15"
        }
      };
      document.getElementById('credential').value = JSON.stringify(sample, null, 2);
    };
  </script>
</body>
</html>
