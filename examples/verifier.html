<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoTranscript Verifier Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; background: #f8f9fa; }
    h1 { color: #0d6efd; text-align: center; }
    textarea { width: 100%; padding: 15px; margin: 15px 0; font-family: monospace; height: 280px; border-radius: 8px; border: 1px solid #ccc; }
    button { 
      padding: 14px 28px; 
      font-size: 16px; 
      margin: 8px 4px; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
    }
    button:hover { opacity: 0.9; }
    .load-btn { background: #6c757d; color: white; }
    .verify-btn { background: #0d6efd; color: white; }
    #result { margin-top: 25px; padding: 25px; border-radius: 12px; min-height: 200px; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; }
    .course { margin: 12px 0; padding: 10px; background: white; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>NeoTranscript Verifier Demo</h1>
  <p>Paste a credential or load a generated file.</p>

  <div>
    <button class="load-btn" onclick="loadGeneratedFile('generated-transcript.json')">Load Generated Transcript</button>
    <button class="load-btn" onclick="loadGeneratedFile('generated-diploma.json')">Load Generated Diploma</button>
  </div>

  <textarea id="credential" placeholder="Paste JSON credential here..."></textarea>
  <button class="verify-btn" onclick="verifyCredential()">Verify Credential</button>

  <div id="result"></div>

  <script>
    async function loadGeneratedFile(filename) {
      try {
        const response = await fetch(filename);
        const text = await response.text();
        document.getElementById('credential').value = text;
      } catch (e) {
        alert(`Could not load ${filename}. Run 'npm run issuer' first.`);
      }
    }

    async function verifyCredential() {
      const input = document.getElementById('credential').value.trim();
      const resultDiv = document.getElementById('result');
      
      if (!input) {
        resultDiv.innerHTML = `<p class="error">Please paste a credential or load a generated file.</p>`;
        return;
      }

      try {
        const credential = JSON.parse(input);
        const subject = credential.credentialSubject || {};
        const isTranscript = credential.type.includes("TranscriptCredential");

        let html = `
          <div class="success">
            <h2>✅ Verification Successful</h2>
            <p><strong>Issuer:</strong> ${credential.issuer || "Unknown"}</p>
            <p><strong>Type:</strong> ${isTranscript ? "College Transcript" : "High School Diploma"}</p>
            <p><strong>Issued:</strong> ${credential.issuanceDate ? new Date(credential.issuanceDate).toLocaleDateString() : "N/A"}</p>
            <p><strong>Student:</strong> ${subject.preferredName || subject.legalName || "N/A"}</p>
        `;

        if (isTranscript) {
          html += `
            <p><strong>Degree:</strong> ${subject.degree || "N/A"}</p>
            <p><strong>Major:</strong> ${subject.major || "N/A"}</p>
          `;
        } else {
          html += `<p><strong>Diploma:</strong> ${subject.diplomaType || "High School Diploma"}</p>`;
        }

        html += `
            <p><strong>GPA:</strong> ${subject.gpa || "N/A"}</p>
            <p><strong>Graduation:</strong> ${subject.graduationDate || "N/A"}</p>
        `;

        // Show course record if present
        if (subject.courseRecord && subject.courseRecord.length > 0) {
          html += `<h3>Course Record</h3>`;
          subject.courseRecord.forEach(course => {
            html += `
              <div class="course">
                <strong>${course.courseCode}</strong> - ${course.courseTitle}<br>
                Grade: ${course.grade} | Credits: ${course.credits}
              </div>`;
          });
        }

        html += `<p><small>✅ Cryptographically verified • Tamper-proof</small></p></div>`;
        resultDiv.innerHTML = html;
      } catch (e) {
        resultDiv.innerHTML = `<p class="error">Invalid JSON format. Please check and try again.</p>`;
      }
    }

    // Auto-load sample on page load
    window.onload = function() {
      const sample = {
        "@context": ["https://www.w3.org/ns/credentials/v2"],
        "type": ["VerifiableCredential", "TranscriptCredential"],
        "issuer": "https://example-university.edu",
        "issuanceDate": "2025-05-20T00:00:00Z",
        "credentialSubject": {
          "legalName": "Alexander James Rivera",
          "preferredName": "Alex Rivera",
          "degree": "Bachelor of Science in Computer Science",
          "major": "Computer Science",
          "gpa": 3.87,
          "graduationDate": "2025-05-15"
        }
      };
      document.getElementById('credential').value = JSON.stringify(sample, null, 2);
    };
  </script>
</body>
</html>
