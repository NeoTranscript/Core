<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoTranscript Verifier</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; line-height: 1.6; }
    button { padding: 12px 20px; margin: 8px 4px; font-size: 16px; }
    textarea { width: 100%; height: 200px; font-family: monospace; }
    .card { border: 2px solid #4CAF50; padding: 20px; border-radius: 8px; margin: 15px 0; background: #f9fff9; }
    .success { color: green; font-weight: bold; font-size: 1.3em; }
    .warning { color: orange; }
    .redacted { color: #888; font-style: italic; }
    table { width: 100%; border-collapse: collapse; margin: 15px 0; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #f0f0f0; }
    .scrollable { max-height: 400px; overflow-y: auto; border: 1px solid #eee; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>NeoTranscript Verifier</h1>
  <p>Verifies both full and selectively disclosed credentials.</p>

  <button onclick="loadFromLocalStorage()">Load Latest Shared Credential</button>
  <button onclick="clearVerification()">Clear</button>

  <h3>Or paste credential JSON here:</h3>
  <textarea id="input" placeholder="Paste any credential (full or shared) here..."></textarea><br>
  <button onclick="verifyCredential()">Verify Credential</button>

  <div id="result"></div>

  <hr>
  <p><a href="index.html">← Demo Hub</a> | 
     <a href="issuer.html">← Issuer</a> | 
     <a href="wallet.html">← Wallet</a></p>

  <script>
    async function verifyCredential() {
      const resultEl = document.getElementById('result');
      let cred;

      try {
        const input = document.getElementById('input').value.trim();
        const saved = localStorage.getItem('lastIssuedCredential');

        if (input) {
          cred = JSON.parse(input);
        } else if (saved) {
          cred = JSON.parse(saved);
        } else {
          throw new Error("No credential to verify");
        }

        const subject = cred.credentialSubject || cred;
        const courses = subject.courses || [];
        const isValid = !!(cred.proof && cred.issuer);

        let disclosureNote = '';
        if (cred.disclosureMetadata) {
          disclosureNote = `<p class="warning">⚠️ This is a selectively disclosed version (shared ${new Date(cred.disclosureMetadata.sharedAt).toLocaleString()})</p>`;
        }

        let courseHTML = '';
        if (courses.length > 0) {
          courseHTML = `
            <h3>Courses Included (${courses.length})</h3>
            <div class="scrollable">
              <table>
                <thead><tr><th>Code</th><th>Course Name</th><th>Grade</th><th>Credits</th></tr></thead>
                <tbody>
                  ${courses.map(c => `
                    <tr>
                      <td><strong>${c.courseCode}</strong></td>
                      <td>${c.name}</td>
                      <td>${c.grade}</td>
                      <td>${c.credits}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>`;
        } else if (subject.courses && subject.courses.length === 0) {
          courseHTML = `<p class="redacted">No courses shared in this version</p>`;
        }

        const html = `
          <div class="card">
            <h2>Verification Result</h2>
            ${isValid ? '<p class="success">✅ VALID CREDENTIAL</p>' : '<p style="color:red;">❌ INVALID</p>'}
            
            ${disclosureNote}
            
            <p><strong>Issuer:</strong> ${cred.issuer}</p>
            <p><strong>Issued:</strong> ${new Date(cred.issuanceDate).toLocaleDateString()}</p>
            
            <h3>Disclosed Information</h3>
            <p><strong>Name:</strong> ${subject.name || '<span class="redacted">[REDACTED]</span>'}</p>
            <p><strong>Degree:</strong> ${subject.degree || '<span class="redacted">[REDACTED]</span>'}</p>
            <p><strong>GPA:</strong> ${subject.gpa !== undefined ? subject.gpa : '<span class="redacted">[HIDDEN]</span>'}</p>
            <p><strong>Graduation Date:</strong> ${subject.graduationDate || '<span class="redacted">[HIDDEN]</span>'}</p>
            
            ${courseHTML}
          </div>
        `;

        resultEl.innerHTML = html;

      } catch (err) {
        resultEl.innerHTML = `
          <div class="card" style="border-color:#f44336;">
            <p style="color:red;">❌ Verification Failed</p>
            <p>${err.message}</p>
          </div>`;
      }
    }

    function loadFromLocalStorage() {
      document.getElementById('input').value = '';
      verifyCredential();
    }

    function clearVerification() {
      document.getElementById('result').innerHTML = '';
    }

    // Auto prompt if credential exists
    window.onload = () => {
      const saved = localStorage.getItem('lastIssuedCredential');
      if (saved) {
        document.getElementById('result').innerHTML = 
          '<p style="color:#666;">Click "Load Latest Shared Credential" to verify.</p>';
      }
    };
  </script>
</body>
</html>
