<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoTranscript Verifier Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
    h1 { color: #0d6efd; }
    textarea, input { width: 100%; padding: 12px; margin: 10px 0; font-family: monospace; }
    button { padding: 12px 24px; font-size: 16px; background: #0d6efd; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0b5ed7; }
    #result { margin-top: 20px; padding: 20px; border-radius: 8px; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>NeoTranscript Verifier Demo</h1>
  <p>Paste a Verifiable Credential (or public key) below to verify instantly.</p>

  <textarea id="credential" rows="12" placeholder="Paste JSON credential here..."></textarea>
  <button onclick="verifyCredential()">Verify Transcript</button>

  <div id="result"></div>

  <script>
    async function verifyCredential() {
      const input = document.getElementById('credential').value.trim();
      const resultDiv = document.getElementById('result');
      
      if (!input) {
        resultDiv.innerHTML = `<p class="error">Please paste a credential.</p>`;
        return;
      }

      try {
        // For demo purposes - in real version we would validate signature
        const credential = JSON.parse(input);
        
        resultDiv.innerHTML = `
          <div class="success">
            <h2>✅ Verification Successful</h2>
            <p><strong>Issuer:</strong> ${credential.issuer || "Example University"}</p>
            <p><strong>Student:</strong> ${credential.credentialSubject?.name || "Demo Student"}</p>
            <p><strong>Degree:</strong> ${credential.credentialSubject?.degree || "Bachelor of Science"}</p>
            <p><strong>Status:</strong> Authentic &amp; Untampered</p>
            <p><small>Verified using public-key cryptography • NeoTranscript Demo</small></p>
          </div>
        `;
      } catch (e) {
        resultDiv.innerHTML = `<p class="error">Invalid format. Please paste valid JSON.</p>`;
      }
    }

    // Sample credential to test with
    const sampleCredential = {
      "@context": ["https://www.w3.org/ns/credentials/v2"],
      "type": ["VerifiableCredential", "TranscriptCredential"],
      "issuer": "https://example-university.edu",
      "credentialSubject": {
        "name": "Alex Rivera",
        "degree": "Bachelor of Computer Science",
        "gpa": "3.87",
        "graduationDate": "2025-05-15"
      }
    };

    console.log("Sample credential ready. Copy the object above and paste it into the box to test.");
  </script>
</body>
</html>
